name: Build gadget image

# Builds the linux/arm64 image in the cloud and pushes it to GHCR, so
# installing the app is just "click install" — no local Docker build.
on:
  push:
    branches: [main]
    paths:
      - 'lommy-muse-gadget/**'
      - '.github/workflows/build-image.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: lommy-muse-gadget
          platforms: linux/arm64
          push: true
          tags: ghcr.io/thefuckisalommy/lommy-muse-gadget:latest
